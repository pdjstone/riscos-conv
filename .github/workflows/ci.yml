name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from git tags by setuptools-scm, which needs
          # the tag history -- a shallow clone has none and it will error out.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e '.[test]'

      - name: Test
        run: python -m pytest --cov=riscosconv --cov-report=term --cov-report=xml -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ruff
        # Pinned, and the rule selection is pinned in pyproject.toml too: ruff's
        # default rule set has widened a lot between releases, so an unpinned
        # version can fail the build on an upgrade alone.
        run: python -m pip install 'ruff==0.16.10'

      - name: Lint
        run: ruff check .

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: python -m pip install build setuptools-scm

      - name: Build wheel
        run: python -m build --wheel

      - name: Check the wheel version matches the tag
        run: |
          python - <<'PY'
          import glob
          import os
          import subprocess
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as z:
              metadata = next(
                  n for n in z.namelist() if n.endswith(".dist-info/METADATA")
              )
              wheel_version = next(
                  line.split(": ", 1)[1]
                  for line in z.read(metadata).decode().splitlines()
                  if line.startswith("Version: ")
              )

          scm_version = subprocess.run(
              ["python", "-m", "setuptools_scm"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          assert wheel_version == scm_version, (
              f"wheel metadata says {wheel_version!r}, "
              f"setuptools-scm says {scm_version!r}"
          )
          print(f"wheel version {wheel_version} matches setuptools-scm")

          # On a tag build the version must be the tag itself -- no .dev or
          # local (+g...) suffix may leak into a release.
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              assert wheel_version == tag.lstrip("v"), (
                  f"tag {tag!r} but wheel version is {wheel_version!r}"
              )
              print(f"matches tag {tag}")
          PY
