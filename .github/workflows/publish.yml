name: Publish

# Pushing a v* tag publishes to PyPI. Requires a PyPI trusted publisher for
# this repo/workflow with environment "pypi"; until that exists the publish
# job fails without uploading anything.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - run: python -m pip install -e '.[test]' build setuptools-scm

      # The tag may point at a commit CI never tested.
      - run: python -m pytest -q

      - run: python -m build

      - run: python scripts/check_version.py "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/riscos-conv
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
